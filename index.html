<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura — Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg-1:#070b18;
  --bg-2:#0d1230;
  --ink:#eef1fb;
  --ink-dim:rgba(238,241,251,0.62);
  --ink-faint:rgba(238,241,251,0.38);

  --glass:rgba(255,255,255,0.055);
  --glass-strong:rgba(255,255,255,0.09);
  --glass-border:rgba(255,255,255,0.14);

  --accent-cyan:#5ee7ff;
  --accent-indigo:#7c7cff;
  --accent-purple:#b083ff;
  --accent-emerald:#5ef2c0;
  --accent-gold:#ffcf86;

  --shadow-soft:0 20px 60px -20px rgba(0,0,0,0.55);
  --shadow-card:0 12px 40px -14px rgba(0,0,0,0.5);
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:12px;

  --ease:cubic-bezier(.22,.9,.3,1);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:'Inter', sans-serif;
  color:var(--ink);
  background:var(--bg-1);
  overflow-x:hidden;
  min-height:100vh;
  position:relative;
}
h1,h2,h3,.display{ font-family:'Outfit', sans-serif; }

::selection{ background:var(--accent-indigo); color:#fff; }

::-webkit-scrollbar{ height:8px; width:8px; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

button{ font-family:inherit; cursor:pointer; }
input{ font-family:inherit; }

.hidden{ display:none !important; }

.bg-layer{
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(124,124,255,0.35), transparent 55%),
    radial-gradient(ellipse at 80% 15%, rgba(94,231,255,0.25), transparent 55%),
    radial-gradient(ellipse at 50% 90%, rgba(176,131,255,0.28), transparent 60%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, #060815 100%);
  transition:background 1.4s var(--ease);
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  opacity:0.55;
  will-change:transform;
}
.blob1{ width:42vw; height:42vw; top:-10%; left:-8%; background:radial-gradient(circle, var(--accent-indigo), transparent 70%); animation:float1 22s ease-in-out infinite; }
.blob2{ width:36vw; height:36vw; bottom:-12%; right:-6%; background:radial-gradient(circle, var(--accent-cyan), transparent 70%); animation:float2 26s ease-in-out infinite; }
.blob3{ width:30vw; height:30vw; bottom:20%; left:30%; background:radial-gradient(circle, var(--accent-purple), transparent 70%); animation:float3 30s ease-in-out infinite; }

@keyframes float1{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(6vw,8vh) scale(1.12); }
}
@keyframes float2{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-5vw,-6vh) scale(1.08); }
}
@keyframes float3{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(4vw,-5vh) scale(1.15); }
}

.mesh-grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at 50% 30%, black 20%, transparent 75%);
}

.particles{ position:absolute; inset:0; }
.particle{
  position:absolute;
  width:3px; height:3px;
  border-radius:50%;
  background:rgba(255,255,255,0.55);
  box-shadow:0 0 6px rgba(255,255,255,0.6);
  animation:drift linear infinite;
}
@keyframes drift{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  10%{ opacity:0.8; }
  90%{ opacity:0.6; }
  100%{ transform:translateY(-110vh) translateX(20px); opacity:0; }
}

body.theme-sunny .bg-layer{ background:
  radial-gradient(ellipse at 25% 15%, rgba(255,207,134,0.4), transparent 55%),
  radial-gradient(ellipse at 80% 20%, rgba(255,160,90,0.22), transparent 55%),
  radial-gradient(ellipse at 50% 90%, rgba(255,111,97,0.18), transparent 60%),
  linear-gradient(160deg, #2a1a1a, #1b1130 60%, #0c0a1a 100%);
}
body.theme-rain .bg-layer{ background:
  radial-gradient(ellipse at 20% 20%, rgba(94,150,255,0.35), transparent 55%),
  radial-gradient(ellipse at 80% 15%, rgba(94,231,255,0.2), transparent 55%),
  radial-gradient(ellipse at 50% 90%, rgba(60,90,160,0.3), transparent 60%),
  linear-gradient(160deg, #0a1020, #0a1230 60%, #05070f 100%);
}
body.theme-snow .bg-layer{ background:
  radial-gradient(ellipse at 20% 20%, rgba(210,230,255,0.3), transparent 55%),
  radial-gradient(ellipse at 80% 15%, rgba(150,190,255,0.22), transparent 55%),
  radial-gradient(ellipse at 50% 90%, rgba(180,200,255,0.2), transparent 60%),
  linear-gradient(160deg, #0c1526, #0d1830 60%, #060a16 100%);
}
body.theme-storm .bg-layer{ background:
  radial-gradient(ellipse at 25% 20%, rgba(160,140,255,0.3), transparent 55%),
  radial-gradient(ellipse at 75% 15%, rgba(90,90,140,0.3), transparent 55%),
  radial-gradient(ellipse at 50% 90%, rgba(40,40,70,0.4), transparent 60%),
  linear-gradient(160deg, #05050c, #0a0a1a 60%, #030308 100%);
}
body.theme-night .bg-layer{ background:
  radial-gradient(ellipse at 20% 15%, rgba(94,90,180,0.25), transparent 55%),
  radial-gradient(ellipse at 80% 10%, rgba(60,70,140,0.2), transparent 55%),
  radial-gradient(ellipse at 50% 90%, rgba(30,30,60,0.35), transparent 60%),
  linear-gradient(160deg, #05060f, #070819 60%, #020208 100%);
}
body.theme-cloudy .bg-layer{ background:
  radial-gradient(ellipse at 20% 20%, rgba(140,150,180,0.28), transparent 55%),
  radial-gradient(ellipse at 80% 15%, rgba(120,140,170,0.2), transparent 55%),
  radial-gradient(ellipse at 50% 90%, rgba(90,100,130,0.25), transparent 60%),
  linear-gradient(160deg, #10131c, #131728 60%, #090a12 100%);
}

.weather-fx{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.raindrop{
  position:absolute; width:1.5px; background:linear-gradient(to bottom, transparent, rgba(180,210,255,0.55));
  animation:fall linear infinite;
}
@keyframes fall{
  0%{ transform:translateY(-10vh); opacity:0; }
  10%{ opacity:1; }
  100%{ transform:translateY(110vh); opacity:0.4; }
}
.snowflake{
  position:absolute; border-radius:50%; background:rgba(255,255,255,0.85);
  animation:snowfall linear infinite;
}
@keyframes snowfall{
  0%{ transform:translate(0,-10vh) rotate(0deg); opacity:0; }
  10%{ opacity:0.9; }
  100%{ transform:translate(30px,110vh) rotate(200deg); opacity:0.5; }
}

#loading-screen{
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  background:radial-gradient(ellipse at 50% 40%, rgba(124,124,255,0.18), transparent 60%), #070912;
  backdrop-filter:blur(30px);
  transition:opacity .7s var(--ease), visibility .7s var(--ease);
}
#loading-screen.fade-out{ opacity:0; visibility:hidden; pointer-events:none; }

.logo-mark{
  width:74px; height:74px; position:relative;
}
.logo-mark svg{ width:100%; height:100%; }
.logo-ring{
  stroke-dasharray:220; stroke-dashoffset:220;
  animation:draw 1.8s var(--ease) infinite;
}
@keyframes draw{
  0%{ stroke-dashoffset:220; }
  50%{ stroke-dashoffset:0; }
  100%{ stroke-dashoffset:-220; }
}
.loader-text{
  font-family:'Outfit', sans-serif; font-weight:600; letter-spacing:0.3em;
  font-size:13px; text-transform:uppercase; color:var(--ink-dim);
  background:linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-cyan));
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shimmer 2.4s linear infinite;
}
@keyframes shimmer{
  0%{ background-position:0% 50%; }
  100%{ background-position:200% 50%; }
}

.app{
  position:relative; z-index:2;
  max-width:1200px; margin:0 auto;
  padding:32px 24px 80px;
  display:flex; flex-direction:column; gap:28px;
}

.top-bar{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:20px; letter-spacing:-0.02em;
}
.brand .dot{
  width:9px; height:9px; border-radius:50%;
  background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));
  box-shadow:0 0 14px var(--accent-cyan);
}

.search-wrap{
  display:flex; align-items:center; gap:10px; flex:1; max-width:520px; min-width:240px;
}
.search-box{
  flex:1;
  display:flex; align-items:center; gap:10px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:999px;
  padding:12px 18px;
  backdrop-filter:blur(20px);
  transition:border-color .3s var(--ease), box-shadow .3s var(--ease), transform .2s var(--ease);
}
.search-box:focus-within{
  border-color:rgba(94,231,255,0.5);
  box-shadow:0 0 0 4px rgba(94,231,255,0.08), 0 12px 30px -10px rgba(0,0,0,0.5);
  transform:translateY(-1px);
}
.search-box i{ color:var(--ink-faint); font-size:14px; }
.search-box input{
  flex:1; background:none; border:none; outline:none;
  color:var(--ink); font-size:14.5px;
}
.search-box input::placeholder{ color:var(--ink-faint); }

.icon-btn{
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--glass);
  border:1px solid var(--glass-border);
  color:var(--ink-dim);
  backdrop-filter:blur(20px);
  transition:all .3s var(--ease);
  flex-shrink:0;
}
.icon-btn:hover{
  background:var(--glass-strong);
  color:var(--ink);
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 10px 24px -10px rgba(94,231,255,0.4);
}
.icon-btn:active{ transform:scale(0.94); }
.icon-btn.loading i{ animation:spin 0.9s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.search-btn{
  border:none; border-radius:999px; padding:12px 22px;
  background:linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
  color:#fff; font-weight:600; font-size:14px;
  display:flex; align-items:center; gap:8px;
  box-shadow:0 10px 26px -10px rgba(124,124,255,0.6);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);
  flex-shrink:0;
}
.search-btn:hover{ transform:translateY(-2px); box-shadow:0 16px 34px -12px rgba(124,124,255,0.7); }
.search-btn:active{ transform:translateY(0) scale(0.98); }

.glass-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:var(--shadow-card);
  position:relative;
  overflow:hidden;
}

.hero-card{
  padding:40px 40px 34px;
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:30px;
  align-items:center;
}

.hero-left{ display:flex; flex-direction:column; gap:6px; }
.hero-loc{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.hero-loc .city{ font-size:26px; font-weight:700; letter-spacing:-0.01em; }
.hero-loc .country{ font-size:14px; color:var(--ink-faint); font-weight:500; }
.hero-date{ font-size:13.5px; color:var(--ink-dim); }
.hero-clock{
  font-family:'Outfit',sans-serif; font-size:15px; font-weight:500; color:var(--ink-dim);
  display:flex; align-items:center; gap:8px; margin-top:2px;
}
.hero-clock .pulse-dot{
  width:6px; height:6px; border-radius:50%; background:var(--accent-emerald);
  box-shadow:0 0 8px var(--accent-emerald);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(0.75); } }

.hero-temp-row{ display:flex; align-items:flex-end; gap:18px; margin-top:18px; }
.hero-temp{
  font-size:88px; font-weight:700; line-height:0.9; letter-spacing:-0.03em;
  background:linear-gradient(180deg, #fff, var(--ink-dim));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-temp sup{ font-size:36px; font-weight:500; }
.hero-meta{ display:flex; flex-direction:column; gap:4px; padding-bottom:10px; }
.hero-desc{ font-size:16px; font-weight:600; text-transform:capitalize; }
.hero-feels{ font-size:13px; color:var(--ink-faint); }

.hero-hilo{ display:flex; gap:18px; margin-top:16px; }
.hero-hilo span{ font-size:13px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
.hero-hilo b{ color:var(--ink); font-weight:600; }

.hero-right{ display:flex; align-items:center; justify-content:center; }
.icon-stage{ width:190px; height:190px; display:flex; align-items:center; justify-content:center; }
.icon-stage svg{ width:100%; height:100%; overflow:visible; }

.section-title{
  display:flex; align-items:center; gap:10px;
  font-size:14px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--ink-dim); margin-bottom:14px;
}
.section-title i{ color:var(--accent-cyan); font-size:13px; }

.info-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:16px; }
.info-card{ padding:20px 18px; display:flex; flex-direction:column; gap:12px; }
.info-card .ic-icon{
  width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, rgba(94,231,255,0.18), rgba(176,131,255,0.18));
  color:var(--accent-cyan); font-size:15px;
}
.info-card .ic-value{ font-size:22px; font-weight:700; }
.info-card .ic-label{ font-size:12px; color:var(--ink-faint); text-transform:uppercase; }

.tri-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
@media (max-width:900px){ .tri-grid{ grid-template-columns:1fr; } }

.sun-card, .air-card, .extra-card{ padding:26px; }

.air-row, .extra-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13.5px;
}
.air-row:last-child, .extra-row:last-child{ border-bottom:none; }

.hourly-scroll{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
.hour-card{ min-width:96px; padding:18px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; }

.forecast-scroll{ display:grid; grid-template-columns:repeat(5, 1fr); gap:16px; }
@media (max-width:820px){
  .forecast-scroll{ grid-auto-flow:column; grid-auto-columns:minmax(140px,1fr); overflow-x:auto; grid-template-columns:none; }
}
.day-card{ padding:22px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }

#error-toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:200; display:flex; align-items:center; gap:12px; padding:16px 22px;
  border-radius:var(--radius-md); background:rgba(30,14,20,0.85); border:1px solid rgba(255,110,110,0.35);
  backdrop-filter:blur(20px); opacity:0; visibility:hidden; transition:all .4s var(--ease);
}
#error-toast.show{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="logo-mark">
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="34" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
      <circle class="logo-ring" cx="50" cy="50" r="34" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="100" y2="100">
          <stop offset="0%" stop-color="#5ee7ff"/>
          <stop offset="100%" stop-color="#b083ff"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div class="loader-text">Reading Open-Meteo Sky</div>
</div>

<div class="bg-layer">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="mesh-grid"></div>
  <div class="particles" id="particles"></div>
</div>
<div class="weather-fx" id="weather-fx"></div>

<div class="app">

  <div class="top-bar">
    <div class="brand"><span class="dot"></span> Aura Weather (Keyless API)</div>
    <div class="search-wrap">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="city-input" placeholder="Search a city…" autocomplete="off">
      </div>
      <button class="icon-btn" id="locate-btn" title="Use my location">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
      <button class="search-btn" id="search-btn">
        <i class="fa-solid fa-arrow-right"></i> Search
      </button>
    </div>
  </div>

  <div class="hero-card glass-card">
    <div class="hero-left">
      <div class="hero-loc">
        <span class="city" id="city-name">—</span>
        <span class="country" id="country-name"></span>
      </div>
      <div class="hero-date" id="hero-date">—</div>
      <div class="hero-clock"><span class="pulse-dot"></span><span id="hero-clock">--:--:--</span></div>

      <div class="hero-temp-row">
        <div class="hero-temp" id="hero-temp">--<sup>°C</sup></div>
        <div class="hero-meta">
          <div class="hero-desc" id="hero-desc">—</div>
          <div class="hero-feels" id="hero-feels">Feels like --°</div>
        </div>
      </div>

      <div class="hero-hilo">
        <span><i class="fa-solid fa-arrow-up"></i> High <b id="hero-high">--°</b></span>
        <span><i class="fa-solid fa-arrow-down"></i> Low <b id="hero-low">--°</b></span>
      </div>
    </div>

    <div class="hero-right">
      <div class="icon-stage" id="hero-icon-stage"></div>
    </div>
  </div>

  <div>
    <div class="section-title"><i class="fa-solid fa-chart-simple"></i> Conditions</div>
    <div class="info-grid" id="info-grid"></div>
  </div>

  <div class="tri-grid">
    <div class="glass-card sun-card">
      <div class="section-title"><i class="fa-solid fa-sun"></i> Sunrise &amp; Sunset</div>
      <div style="margin-top:20px;">
        <div class="air-row"><span class="a-label">Sunrise</span><span class="a-value" id="sunrise-time">--:--</span></div>
        <div class="air-row"><span class="a-label">Sunset</span><span class="a-value" id="sunset-time">--:--</span></div>
      </div>
    </div>

    <div class="glass-card air-card">
      <div class="section-title"><i class="fa-solid fa-wind"></i> Air Conditions</div>
      <div class="air-row"><span class="a-label">Pressure</span><span class="a-value" id="air-pressure">-- hPa</span></div>
      <div class="air-row"><span class="a-label">Humidity</span><span class="a-value" id="air-humidity">--%</span></div>
      <div class="air-row"><span class="a-label">Wind</span><span class="a-value" id="air-wind">-- km/h</span></div>
    </div>

    <div class="glass-card extra-card">
      <div class="section-title"><i class="fa-solid fa-circle-info"></i> Coordinates</div>
      <div class="extra-row"><span class="e-label">Latitude</span><span class="e-value" id="extra-lat">--</span></div>
      <div class="extra-row"><span class="e-label">Longitude</span><span class="e-value" id="extra-lon">--</span></div>
    </div>
  </div>

  <div>
    <div class="section-title"><i class="fa-solid fa-clock"></i> Hourly Forecast</div>
    <div class="hourly-scroll glass-card" style="border:none;background:transparent;box-shadow:none;padding:6px;" id="hourly-scroll"></div>
  </div>

  <div>
    <div class="section-title"><i class="fa-solid fa-calendar-days"></i> 7-Day Forecast</div>
    <div class="forecast-scroll" id="forecast-scroll"></div>
  </div>

</div>

<div id="error-toast">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <span class="err-text" id="error-text">Something went wrong.</span>
</div>

<script>
const $ = (id) => document.getElementById(id);

window.addEventListener("DOMContentLoaded", () => {
  startClock();
  fetchByCity("London");
});

$("search-btn").addEventListener("click", () => {
  const val = $("city-input").value.trim();
  if (val) fetchByCity(val);
});

async function fetchByCity(cityName) {
  $("loading-screen").classList.remove("fade-out");
  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);
    const geoData = await geoRes.json();
    
    if (!geoData.results || geoData.results.length === 0) {
      throw new Error("City not found");
    }

    const city = geoData.results[0];
    fetchWeatherData(city.latitude, city.longitude, city.name, city.country || "");
  } catch (err) {
    $("loading-screen").classList.add("fade-out");
    showError(err.message);
  }
}

async function fetchWeatherData(lat, lon, cityName, country) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,surface_pressure,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`);
    const data = await res.json();

    renderUI(data, cityName, country, lat, lon);
    $("loading-screen").classList.add("fade-out");
  } catch (err) {
    $("loading-screen").classList.add("fade-out");
    showError("Failed to fetch weather data.");
  }
}

function renderUI(data, city, country, lat, lon) {
  const cur = data.current;
  const daily = data.daily;

  $("city-name").textContent = city;
  $("country-name").textContent = country;
  $("hero-date").textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  $("hero-temp").innerHTML = `${Math.round(cur.temperature_2m)}<sup>°C</sup>`;
  $("hero-desc").textContent = getWeatherText(cur.weather_code);
  $("hero-feels").textContent = `Feels like ${Math.round(cur.apparent_temperature)}°`;
  $("hero-high").textContent = `${Math.round(daily.temperature_2m_max[0])}°`;
  $("hero-low").textContent = `${Math.round(daily.temperature_2m_min[0])}°`;

  $("sunrise-time").textContent = daily.sunrise[0].split("T")[1];
  $("sunset-time").textContent = daily.sunset[0].split("T")[1];
  $("air-pressure").textContent = `${cur.surface_pressure} hPa`;
  $("air-humidity").textContent = `${cur.relative_humidity_2m}%`;
  $("air-wind").textContent = `${cur.wind_speed_10m} km/h`;

  $("extra-lat").textContent = lat;
  $("extra-lon").textContent = lon;

  $("info-grid").innerHTML = `
    <div class="info-card glass-card">
      <div class="ic-icon"><i class="fa-solid fa-droplet"></i></div>
      <div class="ic-value">${cur.relative_humidity_2m}%</div>
      <div class="ic-label">Humidity</div>
    </div>
    <div class="info-card glass-card">
      <div class="ic-icon"><i class="fa-solid fa-wind"></i></div>
      <div class="ic-value">${cur.wind_speed_10m} km/h</div>
      <div class="ic-label">Wind Speed</div>
    </div>
    <div class="info-card glass-card">
      <div class="ic-icon"><i class="fa-solid fa-gauge"></i></div>
      <div class="ic-value">${cur.surface_pressure} hPa</div>
      <div class="ic-label">Pressure</div>
    </div>
  `;

  renderHourly(data.hourly);
  renderForecast(data.daily);
}

function renderHourly(hourly) {
  const scroll = $("hourly-scroll");
  scroll.innerHTML = "";
  for (let i = 0; i < 8; i++) {
    const time = hourly.time[i].split("T")[1];
    const temp = Math.round(hourly.temperature_2m[i]);
    scroll.innerHTML += `
      <div class="hour-card glass-card">
        <div style="font-size:12px;color:var(--ink-faint);">${time}</div>
        <div style="font-size:18px;font-weight:700;">${temp}°</div>
      </div>
    `;
  }
}

function renderForecast(daily) {
  const scroll = $("forecast-scroll");
  scroll.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const date = daily.time[i];
    const max = Math.round(daily.temperature_2m_max[i]);
    const min = Math.round(daily.temperature_2m_min[i]);
    scroll.innerHTML += `
      <div class="day-card glass-card">
        <div class="d-name">${date}</div>
        <div class="d-desc">${getWeatherText(daily.weather_code[i])}</div>
        <div class="d-temps"><span>${max}°</span> <span style="color:var(--ink-faint);">${min}°</span></div>
      </div>
    `;
  }
}

function getWeatherText(code) {
  if (code === 0) return "Clear Sky";
  if (code <= 3) return "Partly Cloudy";
  if (code <= 48) return "Foggy";
  if (code <= 67) return "Rainy";
  if (code <= 77) return "Snowy";
  return "Thunderstorm";
}

function showError(msg) {
  $("error-text").textContent = msg;
  $("error-toast").classList.add("show");
  setTimeout(() => $("error-toast").classList.remove("show"), 4000);
}

function startClock() {
  setInterval(() => {
    $("hero-clock").textContent = new Date().toLocaleTimeString();
  }, 1000);
}
</script>
</body>
</html>
